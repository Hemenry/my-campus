# GeekCampus · Nginx
# 安装：sudo cp deploy/nginx.conf /etc/nginx/sites-available/geekcampus
#       sudo ln -sf /etc/nginx/sites-available/geekcampus /etc/nginx/sites-enabled/geekcampus
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
#
# 上了域名后把 server_name _ 改成你的域名，再用 certbot 加 HTTPS。

upstream geekcampus_api {
    server 127.0.0.1:5001;
    keepalive 16;
}

# 登录/注册限流：单 IP 每分钟 10 次，突发 5 个排队放行（防撞库；应用内还有失败次数限制）
limit_req_zone $binary_remote_addr zone=geekcampus_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/geekcampus/web/dist;
    index index.html;

    # 后端 MAX_CONTENT_LENGTH 是 8MB，这里留一点余量
    client_max_body_size 10m;
    client_body_timeout 60s;

    access_log /var/log/nginx/geekcampus.access.log;
    error_log  /var/log/nginx/geekcampus.error.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 登录/注册：单独限流（/api/auth/me 等高频接口不限） ----------
    location = /api/auth/login {
        limit_req zone=geekcampus_auth burst=5 nodelay;
        proxy_pass http://geekcampus_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /api/auth/register {
        limit_req zone=geekcampus_auth burst=3 nodelay;
        proxy_pass http://geekcampus_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass http://geekcampus_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- 上传文件（由 Flask 直出，量大后可改 alias） ----------
    location /uploads/ {
        proxy_pass http://geekcampus_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        expires 7d;
    }

    # ---------- 带 hash 的构建产物，可以长缓存 ----------
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 入口页不缓存，保证发版后能拿到新 hash ----------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------- 前端路由（createWebHashHistory，hash 模式） ----------
    # hash 路由不经过服务端，这里 fallback 只兜底直接访问子路径的场景
    location / {
        try_files $uri $uri/ /index.html;
    }
}
